name: Universe Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stock_machine/sectors.py"
      - "scripts/sync_universe.py"
      - "scripts/specs_hims.py"
      - "scripts/run_hims_analysis.py"
      - ".github/workflows/universe-sync.yml"

permissions:
  contents: read

concurrency:
  group: universe-sync
  cancel-in-progress: false

jobs:
  sync:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock machine
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Require production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is required." >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Ingest missing universe names
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PRICE_SOURCE: yahoo
        run: python scripts/sync_universe.py
      - name: Persist HIMS analyst report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/run_hims_analysis.py
      - name: Refresh coverage snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_coverage_snapshot.py
