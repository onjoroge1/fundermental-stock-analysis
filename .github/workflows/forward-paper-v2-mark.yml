name: Forward Paper v2 Mark

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: forward-paper-v2-mark
  cancel-in-progress: false

jobs:
  mark:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock machine
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Require production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is required." >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Refresh stale daily prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_SOURCE: yahoo
        run: python scripts/refresh_prices.py --max-age-hours 18
      - name: Mark frozen cohorts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/mark_forward_paper_v2.py
