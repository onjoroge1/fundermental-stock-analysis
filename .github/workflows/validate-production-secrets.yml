name: Validate Production Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-production-secrets.yml

permissions:
  contents: read

jobs:
  validate:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Verify both secrets are available
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL FMP_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name: present"
            else
              echo "::error::$name: empty"
              missing=1
            fi
          done
          exit "$missing"
