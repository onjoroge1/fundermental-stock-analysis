name: Daily Data and Forecast Refresh

on:
  workflow_dispatch:
  schedule:
    # 17:30 Eastern in summer / 16:30 in winter, after the regular close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-data-forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      PRICE_SOURCE: yahoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set the DATABASE_URL repository Actions secret before running data jobs." >&2
            exit 1
          fi
      - name: Install application
        run: python -m pip install -e .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Ingest missing configured universe names
        run: python scripts/sync_universe.py
      - name: Refresh benchmark and sector series
        run: python scripts/refresh_prices.py --benchmarks
      - name: Refresh company inputs and canonical forecasts
        run: python scripts/daily_refresh.py
