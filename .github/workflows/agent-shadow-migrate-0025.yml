name: Agent Shadow Migration 0025

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - migrations/versions/0025_agent_shadow.py
      - .github/workflows/agent-shadow-migrate-0025.yml

permissions:
  contents: read

concurrency:
  group: agent-shadow-schema-and-technical
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Apply and verify shadow migration
        run: |
          python - <<'PY'
          from alembic import command
          from alembic.config import Config
          from stock_machine import db
          with db.connect() as conn:
              before = {r[0] for r in conn.execute('SELECT version_num FROM alembic_version')}
          if before not in ({'0024_agent_universe_learning'}, {'0025_agent_shadow'}, {'0026_technical_setup_shadow'}):
              raise SystemExit('UNEXPECTED_DATABASE_REVISION')
          command.upgrade(Config('alembic.ini'), 'head')
          with db.connect() as conn:
              db.init_schema(conn)
          print('SHADOW_SCHEMA_VERIFIED; paper settings unchanged')
          PY
