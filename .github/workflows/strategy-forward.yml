name: Strategy Forward Shadow

# Daily: after each session, freeze the event strategies' entry flags before
# the next open, then record trades whose windows have completed. Same
# schedule as the fair-value tracker: the night run follows ingestion; the
# three morning runs are final attempts (within 4h of the open) in EST and EDT.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 2-6"
    - cron: "50 10 * * 1-5"
    - cron: "50 11 * * 1-5"
    - cron: "35 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: strategy-forward
  cancel-in-progress: false

jobs:
  shadow:
    # Evidence is append-only: only main may register the protocol or freeze.
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Verify schema
        run: |
          python - <<'PY'
          from stock_machine import db
          with db.connect() as conn:
              db.init_schema(conn)
          PY
      - name: Freeze the latest session, then record completed trades
        run: python -m scripts.run_strategy_forward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-forward-${{ github.run_id }}
          path: data/strategy_forward/
          if-no-files-found: warn
          retention-days: 90
