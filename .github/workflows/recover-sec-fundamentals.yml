name: Recover SEC Fundamentals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-sec-fundamentals.yml"
      - "scripts/recover_sec_fundamentals.py"
      - "stock_machine/ingestion/cover_shares.py"
      - "stock_machine/normalization/financial_periods.py"
      - "stock_machine/normalization/xbrl_mapping.py"
permissions:
  contents: read
concurrency:
  # Share the daily writer's group so an older scheduled checkout cannot
  # overwrite the release recovery while it is still refreshing inputs.
  group: daily-data-forecast-refresh
  cancel-in-progress: false
jobs:
  recover:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Verify database schema
        run: alembic upgrade head
      - name: Recover SEC inputs and verify forecasts
        run: python scripts/recover_sec_fundamentals.py
      - name: Save source evidence and accounting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-recovery-evidence
          path: |
            data/accounting-recovery-report.json
            data/raw/sec/
          retention-days: 30
