name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,p1]'
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q stock_machine
      - name: Render database migration
        env:
          DATABASE_URL: postgresql://user:password@localhost/stock_machine
        run: alembic upgrade head --sql > /tmp/stock-machine-schema.sql
      - name: Run tests
        run: python -m pytest -q
