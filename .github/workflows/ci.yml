name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stock_machine
          POSTGRES_PASSWORD: stock_machine_ci
          POSTGRES_DB: stock_machine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_machine -d stock_machine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stock_machine:stock_machine_ci@localhost:5432/stock_machine_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,p1]'
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q stock_machine
      - name: Render database migration
        env:
          DATABASE_URL: postgresql://user:password@localhost/stock_machine
        run: alembic upgrade head --sql > /tmp/stock-machine-schema.sql
      - name: Run tests
        run: python -m pytest -q
