name: Strategy Lab v2

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 6"

permissions:
  contents: read

concurrency:
  group: strategy-lab-v2
  cancel-in-progress: false

jobs:
  evaluate:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock machine
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Require production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is required." >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Run Strategy Lab v2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/run_strategy_lab_v2.py 15
