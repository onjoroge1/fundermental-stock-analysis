name: Heuristic Direction Replay

# Manual, read-only historical baseline for the agent's heuristic direction.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direction-replay
  cancel-in-progress: false

jobs:
  replay:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Replay the heuristic direction (read-only)
        run: python -m scripts.run_direction_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direction-replay-${{ github.run_id }}
          path: data/direction_replay/
          if-no-files-found: warn
          retention-days: 90
