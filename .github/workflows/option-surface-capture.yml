name: Prospective Option Surface Capture

on:
  push:
    branches: [main]
    paths: [".github/workflows/option-surface-capture.yml"]
  workflow_dispatch:
  schedule:
    # 17:30 Eastern in summer / 16:30 in winter, after the regular close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: prospective-option-surface-capture
  cancel-in-progress: false

jobs:
  capture:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IBKR_PROVIDER: remote_bridge
      IBKR_BRIDGE_BASE_URL: ${{ secrets.IBKR_BRIDGE_BASE_URL }}
      IBKR_BRIDGE_TOKEN: ${{ secrets.IBKR_BRIDGE_TOKEN }}
      IBKR_BRIDGE_TIMEOUT_S: "30"
      IBKR_BRIDGE_VERIFY_SSL: "true"
      P1_OPTION_TICKERS: ${{ vars.P1_OPTION_TICKERS || 'AAPL,AMZN,GOOGL,META,MSFT,NVDA,TSLA,UBER,HIMS,SPY' }}
      P1_OPTION_EXPIRIES: "2"
      P1_OPTION_STRIKES: "18"
      P1_OPTION_MIN_SUCCESSES: ${{ vars.P1_OPTION_MIN_SUCCESSES || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require production capture configuration
        run: |
          missing=0
          for name in DATABASE_URL IBKR_BRIDGE_BASE_URL IBKR_BRIDGE_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "$name: present"
            else
              echo "::error::$name: empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install application
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Capture observed surfaces
        run: |
          python scripts/capture_option_surfaces.py \
            --require-session \
            --min-successes "$P1_OPTION_MIN_SUCCESSES" | tee option-capture.jsonl

      - name: Publish capture summary
        if: always()
        run: |
          {
            echo "## Prospective option surface capture"
            echo ""
            echo '```json'
            tail -n 1 option-capture.jsonl 2>/dev/null || echo '{"status":"capture_not_started"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-surface-capture-${{ github.run_id }}
          path: option-capture.jsonl
          if-no-files-found: ignore
          retention-days: 30
