name: Prospective Option Surface Capture

on:
  push:
    branches: [main]
    paths: [".github/workflows/option-surface-capture.yml"]
  workflow_dispatch:
  schedule:
    # 17:30 Eastern in summer / 16:30 in winter, after the regular close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: prospective-option-surface-capture
  cancel-in-progress: false

jobs:
  capture:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STOCK_MACHINE_ADMIN_TOKEN: ${{ secrets.STOCK_MACHINE_ADMIN_TOKEN }}
      STOCK_MACHINE_API_BASE_URL: ${{ vars.STOCK_MACHINE_API_BASE_URL || 'https://fundermental-stock-analysis.vercel.app' }}
      P1_OPTION_TICKERS: ${{ vars.P1_OPTION_TICKERS || 'AAPL,AMZN,GOOGL,META,MSFT,NVDA,TSLA,UBER,HIMS,SPY' }}
      P1_OPTION_MIN_SUCCESSES: ${{ vars.P1_OPTION_MIN_SUCCESSES || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require production capture configuration
        run: |
          missing=0
          for name in STOCK_MACHINE_ADMIN_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "$name: present"
            else
              echo "::error::$name: empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install API client
        run: python -m pip install 'httpx>=0.27,<1'

      - name: Capture through Vercel API
        shell: bash
        run: python scripts/capture_option_surfaces_api.py | tee option-capture.jsonl

      - name: Publish capture summary
        if: always()
        run: |
          {
            echo "## Prospective option surface capture"
            echo ""
            echo '```json'
            tail -n 1 option-capture.jsonl 2>/dev/null || echo '{"status":"capture_not_started"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-surface-capture-${{ github.run_id }}
          path: option-capture.jsonl
          if-no-files-found: ignore
          retention-days: 30
