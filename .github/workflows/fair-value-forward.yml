name: Fair Value Forward Tracking

# Daily: on a month-end, freeze that session's decisions before the next open,
# then score matured months. The night run follows ingestion and its repair
# run; the three morning runs are all final attempts (within 4h of the open)
# in both EST (14:30 UTC open) and EDT (13:30 UTC open).
on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 2-6"
    - cron: "45 10 * * 1-5"
    - cron: "45 11 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: fair-value-forward
  cancel-in-progress: false

jobs:
  track:
    # Evidence is append-only: only main may register the protocol or freeze.
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Verify schema
        run: |
          python - <<'PY'
          from stock_machine import db
          with db.connect() as conn:
              db.init_schema(conn)
          PY
      - name: Score matured months and freeze a due month-end
        run: python -m scripts.run_fair_value_forward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fair-value-forward-${{ github.run_id }}
          path: data/fair_value_forward/
          if-no-files-found: warn
          retention-days: 90
