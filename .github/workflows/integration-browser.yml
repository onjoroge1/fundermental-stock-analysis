name: Performance browser verification
on:
  pull_request:
    paths:
      - 'webui/performance.*'
      - 'scripts/build_chart_assets.py'
      - 'tests/browser/**'
      - '.github/workflows/integration-browser.yml'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_chart_assets.py
      - run: python -m pip install pytest==8.4.2 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser/test_performance_browser.py
