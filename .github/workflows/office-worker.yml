name: Office Worker

# One bounded pass of office work.
# - By hand: "observe" only reads and prints the office status; "work" does one pass; "canary" is a
#   work pass that fails unless at least one memo task completes cleanly. "resolve" is an owner action:
#   it states that the named blocked tasks' uncertain model calls were never sent, stops charging their
#   reservations and queues the tasks again. It calls no model. "requeue" is an owner action too: it states
#   that the cause of a provider's rejection (for example an empty credit balance) has been fixed and queues
#   the named tasks again. It only moves tasks blocked with a provider-rejection code and calls no model.
# - On the schedule: a work pass every half hour on weekdays. The scheduled job does not even start
#   unless the owner has set the repository Variable that switches the office on, and the worker itself
#   does nothing outside 07:00 to 20:15 New York time.
# This workflow sets no switch, never applies a migration and has no broker access.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: observe (read only), work (one bounded pass), canary (work that must complete a memo), resolve or requeue
        required: true
        default: observe
        type: choice
        options: [observe, work, canary, resolve, requeue]
      task_ids:
        description: "resolve: ids of tasks blocked on an uncertain call that the owner states was never sent. requeue: ids of tasks blocked on a provider rejection whose cause the owner states is fixed"
        required: false
        default: ""
        type: string
  schedule:
    # UTC. Covers 07:00 to 20:15 New York in both winter and summer time; the worker checks the hour itself.
    - cron: "7,37 11-23 * * 1-5"
    - cron: "7,37 0 * * 2-6"

permissions:
  contents: read

concurrency:
  group: office-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.OFFICE_ENABLED == 'true')
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Install the model SDK only if Anthropic is the chosen provider
        if: (github.event_name == 'schedule' || inputs.mode == 'work' || inputs.mode == 'canary') && vars.OFFICE_MODEL_PROVIDER == 'anthropic'
        run: python -m pip install -e ".[office-anthropic]"
      - name: Observe (read only)
        if: github.event_name != 'schedule' && inputs.mode == 'observe'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OFFICE_ENABLED: ${{ vars.OFFICE_ENABLED }}
          OFFICE_PAPER_ENABLED: ${{ vars.OFFICE_PAPER_ENABLED }}
          OFFICE_MODEL_PROVIDER: ${{ vars.OFFICE_MODEL_PROVIDER }}
          OFFICE_MODEL: ${{ vars.OFFICE_MODEL }}
          OFFICE_DAILY_USD_CAP: ${{ vars.OFFICE_DAILY_USD_CAP }}
          OFFICE_MONTHLY_USD_CAP: ${{ vars.OFFICE_MONTHLY_USD_CAP }}
        run: python -m stock_machine.office.worker --mode observe
      - name: Resolve (owner states the calls were never sent)
        if: github.event_name != 'schedule' && inputs.mode == 'resolve'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OFFICE_ENABLED: ${{ vars.OFFICE_ENABLED }}
          WORKER_TASK_IDS: ${{ inputs.task_ids }}
        run: python -m stock_machine.office.worker --mode resolve --call-not-made --task-ids "$WORKER_TASK_IDS"
      - name: Requeue (owner states the cause of the rejection is fixed)
        if: github.event_name != 'schedule' && inputs.mode == 'requeue'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OFFICE_ENABLED: ${{ vars.OFFICE_ENABLED }}
          WORKER_TASK_IDS: ${{ inputs.task_ids }}
        run: python -m stock_machine.office.worker --mode requeue --cause-fixed --task-ids "$WORKER_TASK_IDS"
      - name: Work (one bounded pass)
        if: github.event_name == 'schedule' || inputs.mode == 'work' || inputs.mode == 'canary'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFICE_ENABLED: ${{ vars.OFFICE_ENABLED }}
          OFFICE_PAPER_ENABLED: ${{ vars.OFFICE_PAPER_ENABLED }}
          OFFICE_MODEL_PROVIDER: ${{ vars.OFFICE_MODEL_PROVIDER }}
          OFFICE_MODEL: ${{ vars.OFFICE_MODEL }}
          OFFICE_DAILY_USD_CAP: ${{ vars.OFFICE_DAILY_USD_CAP }}
          OFFICE_MONTHLY_USD_CAP: ${{ vars.OFFICE_MONTHLY_USD_CAP }}
          WORKER_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          WORKER_CANARY: ${{ inputs.mode == 'canary' && '--require-research' || '' }}
        run: python -m stock_machine.office.worker --mode work --trigger "$WORKER_TRIGGER" $WORKER_CANARY
