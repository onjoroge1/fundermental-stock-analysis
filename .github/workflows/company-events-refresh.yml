name: Company Events Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"
    - cron: "30 20 * * 1-5"

permissions:
  contents: read

concurrency:
  group: company-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock machine
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Require production secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is required." >&2
            exit 1
          fi
          if [ -z "$FMP_API_KEY" ]; then
            echo "FMP_API_KEY GitHub Actions secret is required for trustworthy event coverage." >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Refresh company events
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/refresh_company_events.py
