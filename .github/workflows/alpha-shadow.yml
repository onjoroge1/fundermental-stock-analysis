name: Unified Alpha Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 6"

permissions:
  contents: read

concurrency:
  group: unified-alpha-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Require production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Actions secret is required for the real shadow run." >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Run full-universe shadow evaluation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/run_shadow_alpha.py
      - name: Print persisted promotion state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/shadow_status.py
