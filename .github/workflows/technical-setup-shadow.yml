name: Daily Technical Setup Shadow
on:
  workflow_dispatch:
  schedule:
    # 23:30 Eastern summer / 22:30 winter, after the input/forecast refresh.
    - cron: '30 3 * * 2-6'
  push:
    branches: [main]
    paths:
      - migrations/versions/0026_technical_setup_shadow.py
      - .github/workflows/technical-setup-shadow.yml
permissions:
  contents: read
concurrency:
  group: agent-shadow-schema-and-technical
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Apply technical shadow migration
        run: alembic upgrade head
      - name: Verify schema and evaluate completed-session setups
        run: |
          python - <<'PY'
          from stock_machine import db
          with db.connect() as conn:
              db.init_schema(conn)
          PY
          python -m scripts.run_technical_setups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-setup-evidence-${{ github.run_id }}
          path: data/technical_setups/
          if-no-files-found: warn
          retention-days: 90
