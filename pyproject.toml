[project]
name = "stock-machine"
version = "0.1.0"
description = "Point-in-time fundamental stock analysis machine: SEC ingestion, DuckDB normalization, deterministic metrics, Claude MCP analyst layer"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    # FastMCP import path used by stock_machine.mcp_server is a 1.x API.
    "mcp>=1.0,<2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.23",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
prediction = ["torch>=2.2"]
p1 = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5,<5",
]

[project.scripts]
stock-machine = "stock_machine.__main__:main"
stock-machine-ibkr-bridge = "stock_machine.ibkr_bridge:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.vercel]
entrypoint = "stock_machine.webapp_ops:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_machine*"]

[tool.setuptools.package-data]
stock_machine = ["schemas/*.json"]