[project]
name = "stock-machine"
version = "0.1.0"
description = "Point-in-time fundamental stock analysis machine: SEC ingestion, DuckDB normalization, deterministic metrics, Claude MCP analyst layer"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_machine*"]
